name: Takenos
description: Takenos is a Latin American fintech offering a digital dollar wallet built for freelancers,
  remote workers, and businesses who need to receive cross-border payments. It lets users get paid from
  abroad, hold and save in digital dollars with daily yield, and spend via international (TakeCard) and
  local (SpicyCard) debit cards plus QR payments. Riding the LATAM stablecoin and onchain-finance wave,
  it targets remittance friction and local-currency inflation across markets including Argentina and
  Bolivia. Backed by a $5M seed round (investors include 500 Global). No public developer API is
  documented; this profile was enriched from public sources.
